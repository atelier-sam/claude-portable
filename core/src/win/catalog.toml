# Catalogue des logiciels Windows proposés par le wizard (`ccp-core win catalog`).
#
# Chaque identifiant `winget` a été vérifié le 09/11/2026 contre le dépôt officiel
# microsoft/winget-pkgs (chemin manifests/<lettre>/<Éditeur>/<Paquet>/…). Écarté :
#   - RustDesk.RustDesk : absent du dépôt (aucun dossier manifests/r/RustDesk) ;
#   - KeePassXC.KeePassXC : absent ; le paquet existe sous KeePassXCTeam.KeePassXC.
# Volontairement absent : CCleaner (version gratuite interdite par Sam).
#
# Surcharge : `<racine>/config/catalog.toml`, même format, fusion PAR CLÉ champ par
# champ (`remove = true` retire une entrée ; une clé nouvelle doit avoir label + winget).
# Les libellés ne contiennent ni virgule (gum --selected sépare par virgule) ni tabulation.

[[app]]
key = "chrome"
label = "Google Chrome"
category = "Navigateurs"
winget = "Google.Chrome"
default = true

